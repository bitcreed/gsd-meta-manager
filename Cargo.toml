[package]
name = "gsd-meta-manager"
version = "2.2.0"
edition = "2021"
# FLOOR PROVENANCE. This value is not hand-chosen: it is the highest
# `rust-version` declared anywhere in the resolved dependency graph. It is
# currently 1.89.0, set by `uuid` 1.28 alone (since Phase 31 no longer a direct
# dependency: it stays in the lock through `wezterm-blob-leases`, reached from
# ratatui's unenabled termwiz backend, and cargo metadata counts it); the
# `ratatui` 0.30.x family,
# `time`, `darling` and the `icu_*` 2.3.x crates reached through
# `icu_properties` sit one step below at 1.88.0. It moves under an ordinary `cargo update` with no
# edit to this manifest, which is exactly how it drifted past the previously
# declared value unnoticed; the `msrv` job in .github/workflows/release.yml is
# what now catches that before a publish. Re-measure with:
#   cargo metadata --format-version 1 --locked \
#     | jq -r '.packages[].rust_version | select(. != null)' | sort -V | tail -1
rust-version = "1.89"
authors = ["Andreas Brauchli <andy@bitcreed.us>"]
description = "TUI command center for managing multiple GSD-run projects from a single interface."
license = "MIT"
repository = "https://github.com/bitcreed/gsd-meta-manager"
readme = "README.md"
keywords = ["tui", "gsd", "dashboard", "ratatui", "cli"]
categories = ["command-line-utilities"]
# Cargo matches `exclude` entries gitignore-style, so a leading `/` anchors an
# entry to the package root. The entries MUST be anchored: the unanchored
# `assets/` also matched src/driver_templates/assets/ and src/launcher/assets/,
# which hold `include_str!` targets, and the v1.15.0 publish died at
# `failed to verify package tarball`. The anchored `/CLAUDE.md` excludes only
# the root one; any fixture CLAUDE.md under tests/ ships with the crate.
exclude = ["/.planning/", "/CLAUDE.md", "/assets/"]

[dependencies]
# `unstable-rendered-line-info`: `Paragraph::line_count`, so the Backlog
# content pane clamps its scroll against the WRAPPED row count it actually
# draws (quick-260924-drx). A feature of the existing crate — no new crate.
ratatui = { version = "0.30", features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "7"
regex = "1"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
notify = "8"
notify-debouncer-full = "0.7"
tui-textarea = { version = "0.7", features = ["ratatui"] }
# One crate covers BOTH jobs the supervisor needs — process-group signalling
# (`kill_process_group`, plan 17-06) and the single-execution advisory lock
# (`flock`, plan 17-02) — which is why `fs4` was declined (D-08).
# It resolves to 1.1.4, the exact version already present in Cargo.lock
# transitively via ratatui/crossterm, so it adds zero new compilation units to
# the graph. It is pure Rust with no libc linkage, which matches the deliberate
# no-`nix`/no-`libc` posture the process-group code in `src/driver/kill.rs` keeps.
# `system` is for `uname()` in `driverctl::store::host_name` (28 WR-05); like the
# original add it adds no crate, because rustix 1.1.5 is already locked.
rustix = { version = "1.1", features = ["process", "fs", "system"] }
# SHA-256 for the driver opt-in's re-confirmation digest (C-4). A maintained
# RustCrypto implementation rather than a third hand-rolled hash in this tree:
# `journal::argv_digest` is already an inline FNV-1a, and "don't hand-roll" is
# at its sharpest for a function whose whole job is to resist a crafted
# collision.
# The declined alternative was keeping FNV-1a and pinning an honesty sentence
# saying the digest detects accidental drift only. Declined because this
# phase's threat model is explicitly adversarial — the tool drives other
# people's cloned repositories — and a security affordance backed by a
# non-security hash is the exact failure this codebase's honesty conventions
# exist to prevent.
# Graph cost, measured rather than borrowed: 7 newly locked packages —
# sha2 0.11.0, digest 0.11.3, block-buffer 0.12.1, crypto-common 0.2.2,
# hybrid-array 0.4.14, const-oid 0.10.2, cpufeatures 0.3.0 (cfg-if was already
# present). NOTE: this is deliberately NOT the `rustix` case above. A
# `sha2 0.10.9` entry does sit in Cargo.lock, but `cargo tree -i sha2@0.10.9`
# reports "nothing to print" — it is an orphan entry from an unenabled ratatui
# backend feature, not a compiled unit. So this add costs real compilation
# units and leaves two sha2 majors in the lockfile; claiming otherwise by
# reusing rustix's "already present, zero new units" sentence would be false.
sha2 = "0.11.0"
# The invisible-character class, DERIVED rather than enumerated (D-19-1).
#
# `src/text.rs::is_invisible_formatting_char` used to spell three literal
# ranges. Pass 7 measured twenty values ACCEPTED whose every character is
# `General_Category=Cf` or `Default_Ignorable_Code_Point` — inside the class the
# function's own doc named and outside the ranges it spelled. Six consecutive
# rounds "fixed" that by hand-enumerating the next level down, so this add
# replaces the enumeration with a query against Unicode's own reference data
# (ICU4X compiled data, `compiled_data` on by default at 2.x).
#
# The declined alternative was a checked-in generated table. Declined because
# the generator needs network access at generation time and the table is one
# more artifact that stales silently; a crate stales visibly and refreshes under
# the release process's existing `cargo update` (CLAUDE.md, step 2).
#
# WHY TWO CRATES — this is the whole point, not redundancy. The production class
# reads `icu_properties` and the exhaustive sweep's oracle in `src/text.rs`'s
# test module reads `unicode-properties` (dev-dependency below), and neither
# reads the other. An oracle that consumes the predicate it checks can only ever
# agree with it — round-3 WR-03's tautology, which recurred at three levels
# because every fixture in six rounds was sampled from inside the
# implementation. Two independently maintained derivations of the same standard
# means a subset in either goes red against the other (D-19-3, Premise 7a).
#
# STALENESS OBLIGATION, disclosed rather than assumed away (T-21-19-05): the
# class is exactly as current as this crate's pinned Unicode version. A code
# point unassigned at that version, which a future Unicode release makes Cf, is
# accepted in FREE TEXT until the next `cargo update`. Identities are
# version-independent — they are judged by the finite alphabet (D-19-2), not by
# this class.
icu_properties = "2.2.0"
# The launcher-side egress server (Phase 28.1, plan 01; D-04, D-05, D-09). The
# sandbox loses its network, and the run token moves OUTSIDE it: a launcher
# thread terminates the driver's inference requests on a unix socket and
# re-originates them to api.anthropic.com with the real token injected. Four
# crates, each for one job:
#   rustls        TLS to api.anthropic.com. `default-features = false` drops
#                 the aws-lc-rs provider; `ring` is named instead.
#   tokio-rustls  the async TLS stream on the tokio this crate already runs.
#   webpki-roots  the Mozilla root set compiled in, so the trust anchor does
#                 not depend on the host's certificate store.
#   httparse      zero-copy HTTP/1 head parsing for the driver's request.
# Declined, with the reason: hyper (its keep-alive pooling and h2 buy nothing
# here, because every request is buffered whole for inspection and re-sent with
# `Connection: close`; about 8-10 more crates for no policy benefit);
# rustls-native-certs (only worth it together with upstream-proxy chaining,
# which is out of scope); aws-lc-rs (rustls' default, a heavier C build).
# Graph cost, measured by RESEARCH in a scratch copy: +12 locked packages
# (354 -> 366), the highest declared MSRV among them 1.85 (`zeroize`), under the
# 1.89 floor above.
#
# The three TLS crates (rustls, tokio-rustls, webpki-roots) live in the
# Linux-only target table below, not here, because only the Linux bwrap posture
# ever starts the egress server (`run.rs` builds `Upstream::Tls` for
# `Posture::BwrapScope` only, which is unreachable off Linux). `ring` compiles a
# C/asm component with `cc`, so a C compiler is a build requirement on Linux
# only. That also keeps the release workflow's `cross-target-check` green: it
# builds the macOS and Windows targets from an ubuntu runner, where `ring`
# cannot target either platform. Measured: for apple, gcc rejects `-arch` and
# clang stops at `TargetConditionals.h` not found (no macOS SDK); for
# windows-gnu there is no mingw. `cargo install` users on macOS and Windows
# need no C compiler either.
httparse = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# TLS upstream for the egress server (see the egress block above). The feature
# lists are the ones plan 28.1-01 chose; `default-features = false` drops the
# aws-lc-rs provider and `ring` is named instead.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"

[dev-dependencies]
assert_fs = "1"
# `net` for ONE test: `driverctl_cli`'s full-backlog test calls `listen(2)` a
# second time to pick its own backlog, so it needs neither a high `RLIMIT_NOFILE`
# nor a particular `net.core.somaxconn`. Dev-only on purpose (resolver 2 does not
# unify a dev-dependency's features into the release build), and it adds no crate:
# `rustix` and everything `net` pulls in are already locked.
rustix = { version = "1.1", features = ["net"] }
# The INDEPENDENT ORACLE for the invisible class (D-19-3). unicode-rs's
# derivation of the same standard `icu_properties` derives above; see the
# rationale on that entry for why the two must not be one.
#
# `general-category` IS NAMED EXPLICITLY AND MUST STAY THAT WAY, even though it
# is currently a default feature. This oracle is the only thing standing between
# this plan and another six rounds of fixtures that agree with the
# implementation by construction. A default-feature change upstream would delete
# it silently: the `UnicodeGeneralCategory` trait would stop resolving, the
# sweep would stop compiling, and the repair an executor reaches for under a
# broken build is to narrow the sweep. Naming the feature makes that failure a
# resolution error against a feature this manifest demands, not a quiet
# disappearance. The sweep additionally carries its own committed
# `format_seen >= 150` non-vacuity floor for the same reason.
unicode-properties = { version = "0.1.4", features = ["general-category"] }
# The SECOND, independent width oracle for the glyph registry
# (`src/ui/glyphs.rs` tests), beside `icu_properties`' East_Asian_Width class.
# It is already locked as ratatui's `=`-pinned transitive dependency (0.2.0), so
# naming it here adds a dev-only edge and fetches nothing new. `cjk` is named
# explicitly even though it is a default feature: `width_cjk` is half of the
# check, and a default-feature change upstream should fail resolution instead of
# silently removing it.
unicode-width = { version = "0.2", features = ["cjk"] }
