[package]
name = "gsd-meta-manager"
version = "1.5.0"
edition = "2021"
authors = ["Andreas Brauchli <andy@bitcreed.us>"]
description = "TUI command center for managing multiple GSD-run projects from a single interface."
license = "MIT"
repository = "https://github.com/bitcreed/gsd-meta-manager"
readme = "README.md"
keywords = ["tui", "gsd", "dashboard", "ratatui", "cli"]
categories = ["command-line-utilities"]
exclude = [".planning/", "CLAUDE.md"]

[dependencies]
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "6"
regex = "1"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
notify = "8"
notify-debouncer-full = "0.5"
tui-textarea = { version = "0.7", features = ["ratatui"] }

[dev-dependencies]
assert_fs = "1"
