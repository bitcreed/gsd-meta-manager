name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

# Every job pins ubuntu-24.04 rather than ubuntu-latest. The publish job's tests
# are environment-sensitive (the git-version witness in src/envelope/policy.rs
# is derived against the runner's ambient git), and
# scripts/pre-tag-check.Dockerfile is built FROM ubuntu:24.04 to mirror this
# runner. A floating label would move the runner under a release without moving
# that image; bump both together, deliberately.
jobs:
  msrv:
    name: Verify the declared MSRV floor compiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the declared MSRV toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      - name: Check manifest rust-version matches this job's toolchain
        run: |
          MANIFEST_MSRV=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
          if [ -z "$MANIFEST_MSRV" ] || [ "$MANIFEST_MSRV" = "null" ]; then
            echo "::error::Cargo.toml declares no [package] rust-version; this job cannot certify a floor that does not exist" >&2
            exit 1
          fi
          TOOLCHAIN_MSRV=$(rustc --version | awk '{print $2}')
          MANIFEST_MM=$(printf '%s' "$MANIFEST_MSRV" | cut -d. -f1,2)
          TOOLCHAIN_MM=$(printf '%s' "$TOOLCHAIN_MSRV" | cut -d. -f1,2)
          if [ "$MANIFEST_MM" != "$TOOLCHAIN_MM" ]; then
            echo "::error::Cargo.toml rust-version is $MANIFEST_MSRV but this job installed rustc $TOOLCHAIN_MSRV; update the dtolnay/rust-toolchain ref in the msrv job so CI tests the declared floor" >&2
            exit 1
          fi
          echo "Manifest floor $MANIFEST_MSRV agrees with toolchain $TOOLCHAIN_MSRV"

      - name: Compile every target on the declared floor
        run: cargo check --all-targets --locked

  # The crate must still build for macOS and Windows: v1.14 shipped Linux-only
  # code ungated and `cargo install` broke on both. Like everything in this
  # workflow it runs only on a tag push, and `publish` needs it, so a crate that
  # does not compile there never reaches crates.io.
  #
  # It runs on ubuntu with rustup targets rather than on macOS/Windows runners:
  # `cargo check` and clippy stop before the linker, so no foreign runner minutes
  # are spent. Windows is checked as x86_64-pc-windows-gnu because the crate has
  # no `target_env` cfg, which makes it cfg-equivalent to msvc, and gnu is the
  # target verified locally.
  #
  # Clippy covers all targets, tests included, with -D warnings. The test-only
  # helpers that were dead code under the macOS/Windows cfg are now gated to the
  # cfg of their callers (quick 261021-0jg), so a new one fails this gate.
  #
  # scripts/pre-tag-check.sh does not mirror this gate yet; that is a follow-up.
  cross-target-check:
    name: Check non-Linux targets compile (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            check_args: --all-targets
            clippy: true
          - target: x86_64-apple-darwin
            check_args: --all-targets
            clippy: true
          - target: x86_64-pc-windows-gnu
            check_args: --all-targets
            clippy: true
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain with the target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check
        run: cargo check --locked --target "${{ matrix.target }}" ${{ matrix.check_args }}

      - name: Clippy
        if: matrix.clippy
        run: cargo clippy --locked --target "${{ matrix.target }}" --all-targets -- -D warnings

  publish:
    name: Verify and publish to crates.io
    runs-on: ubuntu-24.04
    needs: [msrv, cross-target-check]
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Node is a build-time dependency of the TEST SUITE, not of the crate:
      # the conformance oracle below is a Node program. 24 is the major
      # scripts/pre-tag-check.Dockerfile carries, so the dry run and this job
      # meet the same runtime.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # tests/driver_router_conformance.rs compares this crate's router rule
      # table against GSD's OWN router, and fails BY DESIGN when that oracle is
      # absent — an absent oracle means nothing checked that the transcription
      # still holds. An ubuntu-24.04 runner has Node but no GSD, which is how
      # v1.7.1 died here. THE POINT IS TO PROVIDE THE DEPENDENCY, not to switch
      # the check off. The script pins the exact GSD version read out of
      # GSD_CORE_SYNCED_VERSION and exits non-zero if the oracle does not
      # answer, so this step cannot succeed while leaving the test vacuous.
      # It MUST stay ahead of Test. `./scripts/pre-tag-check.sh --container`
      # calls this same script, so the local rehearsal provisions identically.
      - name: Provision the GSD conformance oracle
        run: ./scripts/install-conformance-oracle.sh

      - name: Check tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$TAG_VERSION" != "$CRATE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CRATE_VERSION" >&2
            exit 1
          fi

      - name: Build
        run: cargo build --release

      # --no-fail-fast, deliberately. Fail-fast stops at the first failing test
      # BINARY and hides every later suite behind it — which is exactly how
      # this crate burned three tags discovering one environment-dependent
      # failure at a time. A future breakage now surfaces as a complete list in
      # one run. It is also what makes this job and scripts/pre-tag-check.sh
      # gate 4 finally agree; that script's gate 4 comment records the
      # divergence this line closes.
      - name: Test
        run: cargo test --no-fail-fast

      - name: Clippy
        run: cargo clippy -- -D warnings

      # scripts/pre-tag-check.sh gate 6 runs `cargo package --locked`, this step's
      # pre-upload build-and-verify, before the tag exists. v1.15.0 died here at
      # `failed to verify package tarball`.
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # `cargo publish` leaves the unpacked crate under target/package/. The
      # rust-cache post step's target cleaner walks into it as if it were a
      # project and errors on its missing tests/target and tests/trybuild. It is
      # scratch, never worth caching, so drop it before that post step runs.
      - name: Drop cargo package scratch
        if: always()
        run: rm -rf target/package
